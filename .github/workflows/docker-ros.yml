name: docker-ros

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  docker-ros:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
      - uses: ika-rwth-aachen/docker-ros@main
        with:
          platform: amd64
          target: dev,run
          base-image: rwthika/ros2-torch:jazzy
          rmw-implementation: rmw_zenoh_cpp
          command: ros2 launch focalformer3d_detector focalformer3d_detector_launch.py
          enable-industrial-ci: true
          label-maintainer: Thinking Cars GmbH <info@thinking-cars.de>
          label-authors: Thinking Cars GmbH <info@thinking-cars.de>
        env:
          TARGET_CMAKE_ARGS: -DCMAKE_EXPORT_COMPILE_COMMANDS=1
